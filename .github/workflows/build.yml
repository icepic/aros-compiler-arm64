name: build-image

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to ghcr.io as ci-<run number>
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost || true
          df -h /

      - name: Build host image
        run: docker build -t aros-build-host -f build/Dockerfile.host build

      - name: Build toolchain and SDK
        run: |
          mkdir -p "$RUNNER_TEMP/aros" context
          docker run --name aros-build -e JOBS="$(nproc)" \
              -v "$RUNNER_TEMP/aros":/aros -v "$PWD":/repo:ro -v "$PWD/context":/out \
              aros-build-host /bin/bash /repo/build/build.sh

      - name: Build image
        run: docker build -t "$IMAGE:ci-${{ github.run_number }}" .

      - name: Compile tests
        run: |
          for t in objtest fulltest; do
            docker run --rm -v "$PWD":/work "$IMAGE:ci-${{ github.run_number }}" bash /work/test/$t.sh ci | tee -a test-results.txt
          done

      - name: Save image tarball
        run: docker save "$IMAGE:ci-${{ github.run_number }}" | gzip > aros-compiler-arm64.tar.gz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            test-results.txt
            context/AROS_COMMIT
            ${{ runner.temp }}/aros/run.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: image-tarball
          path: aros-compiler-arm64.tar.gz
          retention-days: 7

      - name: Push to ghcr.io
        if: github.event_name == 'push' || inputs.push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:ci-${{ github.run_number }}"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" aros-compiler-arm64.tar.gz --title "$GITHUB_REF_NAME" --notes "Image tarball: docker load < aros-compiler-arm64.tar.gz"
